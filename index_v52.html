function cleanFoodWords(v){return String(v||"").toLowerCase().replace(/\b\d+(?:\.\d+)?\s*(?:g|kg|ml|l|oz|lb|cups?|tbsp|tsp|x)\b/g," ").replace(/[^a-z]+/g," ").replace(/\b(existing|opened|remaining|dry|raw|frozen|boneless|organic|reduced sodium|large|medium|mild|total|actual|weigh|needed|as needed)\b/g," ").replace(/\s+/g," ").trim()}
function inventoryMatchesIngredient(raw){let q=cleanFoodWords(raw),tokens=q.split(" ").filter(x=>x.length>2);if(!tokens.length)return[];return inventoryFlat().filter(x=>{let n=cleanFoodWords(x.name);if(/\bchicken\b/.test(q)&&/\bchicken\b/.test(n)&&!/broth|stock/.test(q+n))return true;if(/chicken (broth|stock)|(broth|stock).*chicken/.test(q)&&/chicken (broth|stock)|(broth|stock).*chicken/.test(n))return true;if(/beef broth/.test(q)&&/beef broth/.test(n))return true;let hits=tokens.filter(t=>n.includes(t)).length;return hits>=Math.min(2,tokens.length)}).filter(x=>!/\b0\s*—\s*out\b/i.test(x.qty||""))}

function liveContainerMacroV92(rn,ci,weights){
  let r=MEAL.recipes?.[rn], n=componentNutritionV82(rn), totals=componentTotalsFor(rn), m=emptyMacros(), missing=[];

    let g=Number(weights?.[c.id])||0, total=Number(totals[c.id])||0, cm=n.components[c.id]||emptyMacros();

function secondTuesdayAfterRentV130(due){

  return secondTuesdayDate(y,m);

function emergencyCycleV130(y,m){

function emergencyRowsV130(y,m){

  let cy=anchor.getFullYear(),cm=anchor.getMonth();
  while(cy<c.deadline.getFullYear()||(cy===c.deadline.getFullYear()&&cm<=c.deadline.getMonth())){
    monthRows(cy,cm).forEach(x=>{
      if(x.n==="Rent"||x.date<=anchor||x.date>c.deadline)return;
      let key=autopayKey(x); if(state.checks[key])return;

function v7CommitInventory(){
 let sess=v7Session();if(sess.inventoryCommitted)return {ok:true,already:true,used:sess.inventoryUsed||[]};
 let before=JSON.stringify(state.inventory),used=[],bad=[],seen=new Set();
 for(let c of Object.values(sess.components||{}))for(let ing of c.ingredients||[]){
   if(ing.removed)continue;

     let key=c.meal+'|'+ing.plannedIndex;if(seen.has(key))continue;seen.add(key);
     let line=String(ing.actual||ing.name||'').trim();if(!line)continue;

}

// Physical labels follow the corrected plan exactly: full eating day/date, meal, storage, and thaw day for freezer portions. Recipe title stays in Hub only.
physicalLabel=function(target){
  if(!target?.date||!target?.meal||!target?.storage)return [];
  const d=new Date(target.date+'T12:00:00');
  const dateLine=d.toLocaleDateString('en-US',{weekday:'long'}).toUpperCase()+' '+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0')+'/'+String(d.getFullYear()).slice(-2);
  const rows=[dateLine,String(target.meal).toUpperCase(),String(target.storage).toUpperCase()];
  if(String(target.storage).toUpperCase()==='FREEZER'){
    const thaw=new Date(d);thaw.setDate(thaw.getDate()-1);
    rows.push('THAW '+thaw.toLocaleDateString('en-US',{weekday:'short'}).toUpperCase().slice(0,3));
  }
  return rows;
};

function ar14Clock(v){let m=String(v).match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i);if(!m)return 0;let h=+m[1]%12+(m[3].toUpperCase()==='PM'?12:0);return h*60+(+m[2])}

function ar14Build(day){let spec=ACTUAL_ROUTINE_V14[day],tasks=[],seq=0,last=0;spec.sections.forEach(([section,rows])=>rows.forEach(row=>{let [ss,ee,name,subs]=row,st=ar14Clock(ss),en=ar14Clock(ee);while(st<last-60)st+=1440;while(en<=st)en+=1440;last=st;let id=name==='MORNING CARE'?'careM':name==='NIGHT CARE'?'careN':`ar14_${day.slice(0,3).toLowerCase()}_${++seq}`;let stasks=subs==='CARE_MORNING'||subs==='CARE_NIGHT'?ar14Care(subs):(subs||[]).map((z,i)=>({id:`s${i+1}`,name:z,done:false}));tasks.push({id,name,duration:en-st,section,done:false,subtasks:stasks,customFixed:{st,en},actualRoutineV14:true})}));return {start:ar14Clock(spec.start),open:spec.sections[0][0],tasks,actualRoutineV14:true}}

function gymNumericStepV32(ex,sets){
  if(Number.isFinite(Number(ex.inc))&&Number(ex.inc)>0)return Number(ex.inc);
  const nums=sets.map(st=>/^\d+(?:\.\d+)?$/.test(String(st[0]??'').trim())?Number(st[0]):null).filter(v=>v!=null);
  const diffs=[];for(let i=1;i<nums.length;i++){const d=Math.abs(nums[i]-nums[i-1]);if(d>0)diffs.push(d)}
  return diffs.length?Math.min(...diffs):null;
}
function plateTotalV33(raw){
  raw=String(raw??'').trim().replace(/×/g,'x');
  if(/^\d+(?:\.\d+)?$/.test(raw))return Number(raw);
  let total=0;
  for(const part of raw.split('+')){
    const q=part.trim();
    let m=q.match(/^(\d+(?:\.\d+)?)\s*x\s*(\d+(?:\.\d+)?)$/i);
    if(m){total+=Number(m[1])*Number(m[2]);continue}
    if(/^\d+(?:\.\d+)?$/.test(q)){total+=Number(q);continue}
    return null;
  }
  return total;
}
function plateExpressionV33(total){
  total=Number(total);if(!Number.isFinite(total)||total<0)return null;
  // Keep Emmelli's familiar plate notation instead of flattening everything to a raw total.
  const exact={70:'45 + 25',90:'2 × 45',105:'2 × 45 + 15',115:'2 × 45 + 25',125:'2 × 45 + 35',135:'3 × 45',145:'3 × 45 + 10',160:'3 × 45 + 25',180:'4 × 45'};
  if(exact[total])return exact[total];

}

  raw=String(raw??'').trim();const step=Number(ex.inc);
  if(!raw||!Number.isFinite(step)||step<=0)return null;

    return String(Math.max(0,Number(raw)-step));

    const total=plateTotalV33(raw);return total==null?null:plateExpressionV33(total+step);

  if(ex.loadType==='plate-loaded-per-side'||ex.loadType==='smith-plates'){
    if(/^\d+(?:\.\d+)?$/.test(raw))return String(Number(raw)+step);

  }

/* V26 — CLEAN LIVE INVENTORY + STRUCTURED MEASUREMENTS.

   Measurements keep their entered unit plus a normalized mass/volume value when conversion is physically valid.
   Volume is NEVER converted to grams without an ingredient density. */
const INVENTORY_UNITS_V26=[
 ['g','grams (g)'],['kg','kilograms (kg)'],['mL','milliliters (mL)'],['oz','ounces (oz)'],['lb','pounds (lb)'],['fl oz','fluid ounces (fl oz)'],
 ['cup','cups'],['tbsp','tablespoons'],['tsp','teaspoons'],['piece','pieces / whole items'],['slice','slices'],['pack','packs'],['bag','bags'],['jar','jars'],['bottle','bottles'],['box','boxes'],['packet','packets'],['serving','servings']

 if(/^(?:~?\s*)?0(?:\.0+)?\s*(?:—|-)?\s*(?:OUT|EMPTY|NONE)?\s*$/i.test(q))return true;

 else if(u==='oz')out.grams=v*28.349523125;
 else if(u==='lb')out.grams=v*453.59237;
 else if(u==='mL')out.ml=v;

// Canonical current-data cleanup: keep the live Hub focused on current, usable data only.
(function cleanCurrentHubData(){
  // Preserve real history, but remove stale/current-state records that should not keep resurfacing.
  state.budget=state.budget&&typeof state.budget==='object'?state.budget:{};
  const balDate=String(state.budget.balanceAsOf||'');
  if(!balDate || balDate<='2026-09-28' || Number(state.budget.balance)===2.63){
    state.budget.balance=607;
    state.budget.balanceAsOf='2026-10-03';
  }

  // Flexible monthly expenses now live only in flexibleMonthlyByMonth; do not keep the legacy beauty schedule active.
  if(state.budget.flexibleMonthlyByMonth&&Object.keys(state.budget.flexibleMonthlyByMonth).length){
    state.budget.beautyByMonth={};
  }

  // Current Inventory is not history. Remove depleted/empty/currently-out rows and impossible old prepared meals.
  if(state.inventory&&typeof state.inventory==='object'){
    const stalePrepared=/chicken\s*fried\s*rice|chicken\s*cobbler|chicken\s*&\s*dumplings|chicken\s+and\s+dumplings/i;
    const outText=/^(?:0(?:\s|$)|out\b|empty\b|depleted\b|used\b|consumed\b|discarded\b)/i;
    Object.keys(state.inventory).forEach(section=>{
      if(!Array.isArray(state.inventory[section]))return;
      state.inventory[section]=state.inventory[section].filter(item=>{
        if(!item||typeof item!=='object')return false;
        const name=String(item.name||item.item||'');
        const qty=String(item.qty??item.amount??'').trim();
        const status=String(item.status||item.state||'').trim();
        if(stalePrepared.test(name))return false;
        if(outText.test(qty)||outText.test(status))return false;
        if(Number(item.qty)===0||Number(item.amount)===0)return false;
        return true;
      });
    });
  }

  // The active meal plan starts Oct 5. Remove obsolete plan-only days so old unresolved meals cannot reappear.
  if(MEAL?.days&&typeof MEAL.days==='object'){
    Object.keys(MEAL.days).forEach(k=>{if(/^2026-/.test(k)&&k<'2026-10-05')delete MEAL.days[k]});
  }
  if(MEAL?.recipes){delete MEAL.recipes['Chicken Cobbler'];delete MEAL.recipes['Chicken Fried Rice'];}
  if(typeof RECIPE_COMPONENTS==='object'&&RECIPE_COMPONENTS){delete RECIPE_COMPONENTS['Chicken Cobbler'];delete RECIPE_COMPONENTS['Chicken Fried Rice'];}

  // Remove obsolete migration/check markers that can no longer override current values.
  if(state.checks&&typeof state.checks==='object'){
    Object.keys(state.checks).forEach(k=>{
      if(/liveBalance2\.63|sep28|oldMeal|cobbler|friedRice/i.test(k))delete state.checks[k];
    });
    state.checks['currentDataClean|2026-10-03']=true;
  }
  localStorage.setItem(SKEY,JSON.stringify(state));
})();

function envelopeAmountV29(date){let k=localDateKey(date),v=Number(state.budget.envelopeOverrides?.[k]);return Number.isFinite(v)&&v>=0?v:WEEKLY_ENVELOPES}
function emergencyAnchorV29(y,m){
  const id=`${y}-${m}`;

  let bal=validDateKeyRaw(state.budget.balanceAsOf)?new Date(state.budget.balanceAsOf+'T12:00:00'):new Date(y,m,1,12);
  // A future month's notecard begins at the first of that month; current/past month begins at the live-balance anchor.

// Same-month second-Tuesday rule: October rent deadline Oct 13, November rent deadline Nov 10, etc.
rentMonthCycleV131=function(y,m){const due=new Date(y,m,1,12),deadline=secondTuesdayDate(y,m);return {due,deadline,id:`${y}-${m}`,normal:NORMAL_RENT,emergency:EMERGENCY_RENT}};
activeRentCycle=function(now=new Date()){
  let due=new Date(now.getFullYear(),now.getMonth(),1,12);
  for(let guard=0;guard<12;guard++){
    let row={n:'Rent',a:NORMAL_RENT,baseA:NORMAL_RENT,date:new Date(due)};
    if(!state.checks[autopayKey(row)])break;
    due=new Date(due.getFullYear(),due.getMonth()+1,1,12);
  }
  return {due,deadline:secondTuesdayDate(due.getFullYear(),due.getMonth()),rentMonth:new Date(due),id:`${due.getFullYear()}-${due.getMonth()}`};
};

// Weekly envelopes participate in the projection only until that exact occurrence is checked SPENT.
emergencyIncomeEventsV130=function(start,end){
  let out=[],cy=start.getFullYear(),cm=start.getMonth();
  while(cy<end.getFullYear()||(cy===end.getFullYear()&&cm<=end.getMonth())){
    paydays(cy,cm).forEach(day=>{
      let date=new Date(cy,cm,day,12); if(date<=start||date>end)return;
      [['job1','Job #1',JOB_INCOME.job1],['job2','Job #2',JOB_INCOME.job2],['jeremiah','Jeremiah',JOB_INCOME.jeremiah]].forEach(([source,label,amount])=>{
        let key=incomeSourceKey(date,source); if(!state.checks[key])out.push({date,label,amount,kind:'income'});
      });
      let ek=envelopeOccurrenceKeyV29(date),ea=envelopeAmountV29(date);
      if(!state.checks[ek])out.push({date,label:'Weekly envelopes',amount:-ea,kind:'envelope',key:ek});
    });
    cm++;if(cm>11){cm=0;cy++}
  }
  return out;
};

function emergencyCashRowsV29(y,m){
  const c=rentMonthCycleV131(y,m),start=emergencyAnchorV29(y,m),end=c.deadline,out=[];
  let cy=start.getFullYear(),cm=start.getMonth();
  while(cy<end.getFullYear()||(cy===end.getFullYear()&&cm<=end.getMonth())){
    monthRows(cy,cm).forEach(x=>{
      if(x.n==='Rent'||x.date<start||x.date>end)return;
      const key=autopayKey(x),sk=skipKey(x),rec=emergencyMoveRecV28(c.id,x),moved=!!(state.budget.emergency?.[c.id]?.skip?.[sk]);
      out.push({type:'bill',date:new Date(x.date),name:x.n,amount:effectiveAutopayAmount(x),key,sk,row:x,moved,moveRec:rec});
    });
    paydays(cy,cm).forEach(day=>{
      let date=new Date(cy,cm,day,12); if(date<start||date>end)return;

// Save-component is the Inventory transaction. Once saved, its ingredient receipt is locked.
function v42CommitComponentInventory(c){
  if(c.inventoryCommittedV42)return {ok:true,already:true};
  let before=JSON.stringify(state.inventory),used=[],bad=[],seen=new Set();
  for(let ing of c.ingredients||[]){
    if(ing.removed||ing.scope==='CONTAINER_ONLY')continue;
    let z=null;
    if(Number.isInteger(ing.plannedIndex)){
      let key=c.meal+'|'+ing.plannedIndex;if(seen.has(key))continue;seen.add(key);
      let line=String(ing.actual||ing.name||'').trim();if(!line){bad.push(`${ing.name} — ACTUAL AMOUNT MISSING`);continue}
      z=consumeIngredient(line);
    }else if(ing.inventoryRef&&Number(ing.grams)>0){z=consumeInventorySourceV108(ing.inventoryRef,Number(ing.grams),ing.name)}
    else if(ing.inventoryRef){bad.push(`${ing.name} — ACTUAL MEASURED AMOUNT MISSING`);continue}
    if(z){used.push(z);if(!z.deducted)bad.push(`${ing.name} — ${z.reason}`)}
  }
  if(bad.length){state.inventory=JSON.parse(before);return {ok:false,bad}}
  c.inventoryCommittedV42=true;c.inventoryUsedV42=used;c.inventoryCommittedAtV42=new Date().toISOString();return {ok:true,used};
}

// No later whole-session ingredient deduction: components already own that transaction.
v7CommitInventory=function(){

  if(bad.length)return {ok:false,bad};

};
