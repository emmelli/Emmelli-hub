function weeks(){return hero('WEEK BY WEEK','TUESDAY → MONDAY')+back()+`<section class="card"><p><b>WEEKLY INCOME:</b> JOB #1 $650 • JOB #2 $325 • JEREMIAH $185 • TOTAL $1,160</p><p><b>WEEKLY ENVELOPES:</b> GAS $60 • HOUSEHOLD/PRODUCE $100 • DOGS/REPTAR $20 • TOTAL $180</p><p>SCHEDULED BILLS USE THEIR REAL DUE DATES. EMERGENCY-MOVED OCCURRENCES USE THEIR NEW PAY DATE.</p></section>`}function months(){return hero('MONTHS','MONTHLY BILL VIEW')+back()+`<section class="card"><h2>OCTOBER 2026</h2><p>CREDIT CARD: $300 THIS MONTH ONLY • MOM PAYBACK: $200 ON OCT 13 ONLY • FUTURE CREDIT CARD RETURNS TO $25.</p></section>`}
const HIST=['COMPLETE HISTORY','ROUTINE HISTORY','FOOD HISTORY','GYM / WORKOUT HISTORY','BODY PROGRESS HISTORY','GOALS HISTORY','BIBLE + FAITH HISTORY','STUDY HISTORY','COOKING HISTORY','WATER / DAILY HEALTH HISTORY'];function history(){return hero('HISTORY','CHOOSE HISTORY FIRST')+`<section class="card">${HIST.map(x=>`<button class="tile history-option" data-hist="${x}"><b>${x}</b></button>`).join('')}</section>`}function histView(){let type=state.subHist,d=dateObj(),weekStart=new Date(d);weekStart.setDate(d.getDate()-((d.getDay()+6)%7));let weekEnd=new Date(weekStart);weekEnd.setDate(weekStart.getDate()+6),fmtD=x=>x.toLocaleDateString('en-US',{month:'short',day:'numeric'}).toUpperCase();return hero(type,state.date)+back()+`<section class="card"><div class="history-nav"><button class="btn" data-hnav="YEAR">${d.getFullYear()}</button><button class="btn" data-hnav="MONTH">${d.toLocaleDateString('en-US',{month:'long'}).toUpperCase()}</button><button class="btn" data-hnav="WEEK">${fmtD(weekStart)}–${fmtD(weekEnd)}</button><button class="btn" data-hnav="DAY">${day().slice(0,3)}</button></div><label class="field">EXACT DATE<input type="date" id="histDate" value="${state.date}"></label></section>${historyContent(type)}`}
function historyContent(type){let rows=routineRows(),food=state.food[state.date]||[],g=state.gym[state.date],go=state.goals[state.date]||[],b=state.bible[state.date]||{},cook=state.cook[state.date],health=state.health?.[state.date]||{},parts={ROUTINE:{sum:`${rows.filter(x=>done(x.id)).length}/${rows.length} BLOCKS COMPLETED`,detail:rows.filter(x=>done(x.id)).map(x=>x.name).join(' • ')||'NO BLOCKS COMPLETED'},FOOD:{sum:`${food.length} ACTUAL FOOD LOG${food.length===1?'':'S'}`,detail:food.map(x=>`${x.name}${x.grams?` — ${x.grams} G`:''}`).join(' • ')||'NOTHING LOGGED'},WORKOUT:{sum:g?.saved?'SAVED':'NOT SAVED',detail:g?.saved?`SAVED ${g.savedAt||''}`:'NO SAVED WORKOUT'},BODY:{sum:`WEIGHT ${state.weight[state.date]||'—'}`,detail:Object.entries(state.measure[state.date]||{}).map(([k,v])=>`${k}: ${v}`).join(' • ')||'NO MEASUREMENTS'},GOALS:{sum:`${go.filter(x=>x.done).length}/${go.length} COMPLETED`,detail:go.map(x=>`${x.done?'✓':'○'} ${x.title}`).join(' • ')||'NO GOALS'},BIBLE:{sum:(b.ps23||b.ps91||b.ps51)?'LOGGED':'OPEN',detail:`PSALM 23 ${b.ps23?'✓':'○'} • PSALM 91 ${b.ps91?'✓':'○'} • PSALM 51 ${b.ps51?'✓':'○'}`},STUDY:{sum:state.study[state.date]?'COMPLETED':'OPEN',detail:STUDY[day()]},COOKING:{sum:cook?.completed?'COMPLETED':cook?'LOGGED':'OPEN',detail:cook?Object.keys(cook.components||{}).join(' • '):'NO COOKING RECORD'},WATER:{sum:`${state.water[state.date]||0}/5 BOTTLES`,detail:`VITAMINS ${health.vitamins?'✓':'○'} • CREATINE ${health.creatine?'✓':'○'}`}};if(type==='COMPLETE HISTORY')return `<section class="card receipt">${Object.entries(parts).map(([k,v])=>`<details><summary>${k} — ${v.sum}</summary><div>${v.detail}</div></details>`).join('')}</section>`;let key=type.split(' ')[0];if(type.startsWith('GYM'))key='WORKOUT';if(type.startsWith('BODY'))key='BODY';if(type.startsWith('BIBLE'))key='BIBLE';if(type.startsWith('WATER'))key='WATER';let v=parts[key];return `<section class="card"><h2>${type}</h2><p><b>${v?.sum||'NO RECORD'}</b></p><p>${v?.detail||'NO RECORD FOR THIS DATE.'}</p></section>`}
function render(){let out=state.route==='TODAY'?(state.sub==='ROUTINE'?routine():state.sub==='GOALS'?goals():state.sub==='BIBLE'?bible():state.sub==='STUDY'?study():state.sub==='BODY'?body():today()):state.route==='FOOD'?(state.sub==='ACTUAL'?actualFood():state.sub==='PLAN'?mealPlan():state.sub==='INVENTORY'?inventory():state.sub==='GROCERY'?grocery():state.sub==='COOKING'?cooking():food()):state.route==='GYM'?gym():state.route==='BUDGET'?(state.sub==='EMERGENCY'?emergency():state.sub==='AUTOPAY'?autopay():state.sub==='WEEKS'?weeks():state.sub==='MONTHS'?months():state.sub==='SPEND'?spending():state.sub==='BUY'?listEditor('BUY'):budget()):state.route==='HISTORY'?(state.subHist?histView():history()):listEditor('WISH');document.querySelector('#app').innerHTML=out;document.querySelector('#nav').innerHTML=['TODAY','FOOD','GYM','BUDGET','HISTORY','WISH LIST'].map(x=>`<button data-route="${x}" class="${state.route===x?'on':''}"><span class="icon" aria-hidden="true"></span>${x}</button>`).join('')}
function askFields(title,fields,cb){let vals={};for(let f of fields){let v=prompt(`${title}\n${f.label}`,f.value||'');if(v===null)return;vals[f.key]=v}cb(vals)}
document.addEventListener('click',e=>{let t=e.target.closest('button,[data-jump]');if(!t)return;if(t.dataset.route){state.route=t.dataset.route;state.sub=null;state.subHist=null;save();render();return}if(t.hasAttribute('data-back')){state.sub=null;if(state.route==='HISTORY')state.subHist=null;save();render();return}if(t.dataset.sub){state.sub=t.dataset.sub;save();render();return}if(t.dataset.food){state.sub=t.dataset.food;save();render();return}if(t.dataset.context){let x=t.dataset.context;if(x==='GYM'||x==='RUN'){state.route='GYM';state.sub=null}else if(x==='GROCERY'){state.route='FOOD';state.sub='GROCERY'}else if(x==='COOKING'){state.route='FOOD';state.sub='COOKING'}else if(x==='MEASUREMENTS'){state.sub='BODY'}else toast(x+' IS CONNECTED TO THIS DATE.');save();render();return}if(t.dataset.jump){let el=[...document.querySelectorAll('.check')].find(x=>x.id===`r-${CSS.escape(t.dataset.jump)}`);el?.scrollIntoView({behavior:'smooth',block:'center'});return}if(t.hasAttribute('data-late')){let v=prompt('ACTUAL WAKE / ROUTINE START TIME (EXAMPLE 7:18 AM)');if(!v)return;let base=parseTime(ROUTINES[day()].start),actual=parseTime(v);state.late[state.date]=actual-base;save();render();return}if(t.hasAttribute('data-errand')){askFields('ADD AN ERRAND',[{key:'name',label:'ERRAND NAME'},{key:'start',label:'START TIME'},{key:'end',label:'END TIME'}],v=>{let st=parseTime(v.start),en=parseTime(v.end);if(en<=st)en+=1440;state.errands[state.date]=state.errands[state.date]||[];state.errands[state.date].push({sec:'ERRANDS',name:v.name,subs:[],st,en,id:'ERRAND|'+Date.now()});let dur=en-st;state.late[state.date]=(state.late[state.date]||0)+dur;save();render()});return}if(t.hasAttribute('data-addgoal')){let v=document.querySelector('#newGoal').value.trim();if(v){state.goals[state.date]=state.goals[state.date]||[];state.goals[state.date].push({title:v,done:false});save();render()}return}if(t.dataset.delgoal!==undefined){state.goals[state.date].splice(+t.dataset.delgoal,1);save();render();return}if(t.hasAttribute('data-addfood')){askFields('ADD FOOD',[{key:'name',label:'FOOD / SAVED CONTAINER / INVENTORY / GENERIC / BRAND'},{key:'source',label:'SOURCE: SAVED CONTAINER / INVENTORY / GENERIC / BRAND'},{key:'grams',label:'ACTUAL GRAMS'},{key:'calories',label:'CALORIES'},{key:'protein',label:'PROTEIN G'},{key:'carbs',label:'CARBS G'},{key:'fat',label:'FAT G'},{key:'fiber',label:'FIBER G'}],v=>{state.food[state.date]=state.food[state.date]||[];state.food[state.date].push(v);save();render()});return}if(t.dataset.delfood!==undefined){state.food[state.date].splice(+t.dataset.delfood,1);save();render();return}if(t.dataset.recipelink){toast('ADD / EDIT THE ORIGINAL RECIPE LINK IN THE COOKING RECORD WHEN AVAILABLE.');return}if(t.dataset.adding){askFields('ADD INGREDIENT',[{key:'name',label:'INGREDIENT'},{key:'source',label:'SOURCE: INVENTORY / GENERIC / NUTRITION LOOKUP'},{key:'amount',label:'ACTUAL AMOUNT'},{key:'when',label:'WHEN ADDED: DURING COOKING / WHILE PORTIONING / AFTER COOKING'}],v=>{let c=state.cook[state.date].components[t.dataset.adding];c.ingredients.push(v);save();render()});return}if(t.dataset.savecomp){let c=state.cook[state.date].components[t.dataset.savecomp];if(!(Number(c.weight)>0)){toast('ENTER ACTUAL FINISHED COMPONENT WEIGHT FIRST.');return}c.saved=true;save();render();return}if(t.hasAttribute('data-cookcomplete')){state.cook[state.date]=state.cook[state.date]||{components:{},containers:[]};state.cook[state.date].completed=true;save();toast('COOKING SAVED TO HISTORY.');render();return}if(t.dataset.savecontainers){let n=t.dataset.savecontainers,c=state.cook[state.date].components[n];if(!c.saved){toast('SAVE THE COMPONENT FIRST.');return}let inputs=[...document.querySelectorAll(`[data-pack^="${CSS.escape(n)}|"]`)];inputs.forEach((el,i)=>{let g=Number(el.value);if(g>0){state.inventory.CONTAINERS.push({name:n+' #'+(i+1),grams:g,date:state.date,components:[{name:n,grams:g}],nutritionComplete:false,location:i?'FREEZER':'FRIDGE'});}});save();render();return}if(t.dataset.movecontainer!==undefined){let i=+t.dataset.movecontainer,c=state.inventory.CONTAINERS.splice(i,1)[0];if(c){c.location='DEEP FREEZER';state.inventory['DEEP FREEZER'].push(c);save();render()}return}if(t.dataset.moveup!==undefined){let ei=+t.dataset.moveup,p=GYM[day()],rec=state.gym[state.date],sets=rec.sets[ei],ex=p.ex[ei],idx=[2,1,0].find(i=>sets[i].done);if(idx===undefined){toast('COMPLETE A SET BEFORE MOVING IT UP.');return}let w=Number(sets[idx].w);if(Number.isFinite(w))sets[idx].w=w+Number(ex[2]);else toast('COMPLEX PLATE LOAD — USE THE NEXT VALID EQUIPMENT LOAD FOR THIS SET.');save();render();return}if(t.hasAttribute('data-saveworkout')){state.gym[state.date]=state.gym[state.date]||{};state.gym[state.date].saved=true;state.gym[state.date].savedAt=new Date().toISOString();save();toast('WORKOUT SAVED TO HISTORY.');render();return}if(t.dataset.budget){state.sub=t.dataset.budget;save();render();return}if(t.dataset.movebill){let v=prompt('NEW PAY DATE (YYYY-MM-DD)');if(v){state.budget.moved[t.dataset.movebill]=v;save();render()}return}if(t.hasAttribute('data-addspend')){askFields('UNPLANNED SPENDING',[{key:'title',label:'WHERE / MERCHANT'},{key:'amount',label:'AMOUNT'},{key:'category',label:'CATEGORY'},{key:'date',label:'DATE',value:state.date}],v=>{v.amount=Number(v.amount)||0;state.budget.unplanned.push(v);state.budget.balance-=v.amount;save();render()});return}if(t.dataset.delspend!==undefined){let x=state.budget.unplanned.splice(+t.dataset.delspend,1)[0];if(x)state.budget.balance+=Number(x.amount||0);save();render();return}if(t.dataset.additem){askFields('ADD ITEM',[{key:'title',label:'TITLE'},{key:'link',label:'LINK'},{key:'price',label:'PRICE'},{key:'category',label:'CATEGORY'}],v=>{v.price=Number(v.price)||0;(t.dataset.additem==='WISH'?state.wish:state.budget.things).push(v);save();render()});return}if(t.dataset.delitem){let [k,i]=t.dataset.delitem.split('|');(k==='WISH'?state.wish:state.budget.things).splice(+i,1);save();render();return}if(t.dataset.hist){state.subHist=t.dataset.hist;save();render();return}if(t.dataset.hnav){let d=dateObj();if(t.dataset.hnav==='YEAR')d.setFullYear(d.getFullYear()-1);if(t.dataset.hnav==='MONTH')d.setMonth(d.getMonth()-1);if(t.dataset.hnav==='WEEK')d.setDate(d.getDate()-7);if(t.dataset.hnav==='DAY')d.setDate(d.getDate()-1);state.date=d.toISOString().slice(0,10);save();render();return}});
document.addEventListener('change',e=>{let t=e.target;if(t.id==='datePick'||t.id==='histDate'){state.date=t.value;save();render();return}if(t.dataset.r){setDone(t.dataset.r,t.checked);render();return}if(t.dataset.rs){setDone(t.dataset.rs,t.checked,t.dataset.sn);render();return}if(t.dataset.goal!==undefined){state.goals[state.date][+t.dataset.goal].done=t.checked;state.goals[state.date][+t.dataset.goal].completedDate=t.checked?todayKey():null;save();render();return}if(t.dataset.carried){let [d,i]=t.dataset.carried.split('|');state.goals[d][+i].done=t.checked;state.goals[d][+i].completedDate=t.checked?todayKey():null;save();render();return}if(t.dataset.health){state.health=state.health||{};state.health[state.date]=state.health[state.date]||{};state.health[state.date][t.dataset.health]=t.checked;save();render();return}if(t.dataset.foodcomp){let [i,j]=t.dataset.foodcomp.split('|');state.food[state.date][+i].components[+j].eaten=t.checked;save();render();return}if(t.dataset.foodgrams){let [i,j]=t.dataset.foodgrams.split('|');state.food[state.date][+i].components[+j].grams=Number(t.value)||0;save();return}if(t.dataset.water){state.water[state.date]=+t.dataset.water;save();render();return}if(t.dataset.bible){let b=state.bible[state.date]||(state.bible[state.date]={});b[t.dataset.bible.toLowerCase()]=t.checked;save();return}if(t.id==='reflection'){let b=state.bible[state.date]||(state.bible[state.date]={});b.reflection=t.value;save();return}if(t.id==='studyDone'){state.study[state.date]=t.checked;save();return}if(t.id==='weight'){state.weight[state.date]=t.value;save();return}if(t.dataset.measure){state.measure[state.date]=state.measure[state.date]||{};state.measure[state.date][t.dataset.measure]=t.value;save();return}if(t.dataset.compweight){state.cook[state.date].components[t.dataset.compweight].weight=t.value;save();return}if(t.dataset.compused){state.cook[state.date].components[t.dataset.compused].saved=t.checked;save();return}if(t.dataset.set){let [ei,si,k]=t.dataset.set.split('|'),rec=state.gym[state.date];rec.sets[+ei][+si][k]=k==='reps'?Number(t.value):t.value;save();return}if(t.dataset.setdone){let [ei,si]=t.dataset.setdone.split('|');state.gym[state.date].sets[+ei][+si].done=t.checked;save();return}if(t.dataset.abs!==undefined){state.gym[state.date].abs[+t.dataset.abs]=t.checked;save();return}if(t.dataset.tread){state.gym[state.date].tread[t.dataset.tread]=t.value;save();return}if(t.dataset.run){state.gym[state.date].run[t.dataset.run]=t.value;save();return}if(t.dataset.paid){let k=t.dataset.paid,amt=Number(t.dataset.amt);if(t.checked&&!state.budget.paid[k]){state.budget.paid[k]={date:todayKey(),amount:amt};state.budget.balance-=amt}else if(!t.checked&&state.budget.paid[k]){state.budget.balance+=Number(state.budget.paid[k].amount||amt);delete state.budget.paid[k]}save();render();return}});
setInterval(()=>{if(state.route==='TODAY'&&state.sub==='ROUTINE'&&state.date===todayKey())render()},60000);render();
</script></body></html>
