    prep.querySelectorAll('.final-component-flow').forEach(x=>x.remove());
    const wrap=document.createElement('div'); wrap.className='final-component-flow';
    wrap.innerHTML=names.map((rn,ri)=>{
      const r=MEAL.recipes?.[rn], adj=state.cookAdjustments?.[selectedKey()+'|'+rn]||{};
      return `<div class="card soft"><h3>${esc(rn)} — COMPONENTS + INGREDIENTS USED</h3>${cookComponentPanelV115(rn,ri,r,adj)}</div>`;
    }).join('');
    prep.appendChild(wrap);
  }

  const measure = bodyFor('5.');
  if(measure){
    measure.innerHTML=names.map((rn,ri)=>{
      const r=MEAL.recipes?.[rn], key=selectedKey()+'|'+rn, cs=state.cookComponents?.[key]||{};
      const defs=recipeComponentDefs(rn,r), count=Math.max(1,(cookAssignments(rn)||[]).length);
      return `<div class="card soft"><div class="portion-count-banner"><b>${count} CONTAINERS TOTAL</b><span>${esc(rn)} • Each finished component is weighed once below.</span></div><h3>${esc(rn)} — TOTAL COOKED WEIGHTS</h3><p class="muted">Weigh every physically separate finished component. The Hub does the split for you: TOTAL COOKED WEIGHT ÷ ${count} CONTAINERS.</p>${defs.map(c=>{const total=Number(cs[c.id]?.total)||0;return `<label>${esc(c.label)} — TOTAL COOKED WEIGHT (G)<input type="number" min="0" step=".1" data-cook-component-total="${ri}|${esc(c.id)}" value="${esc(cs[c.id]?.total??'')}" placeholder="WEIGH THE WHOLE ${esc(c.label).toUpperCase()}"></label><div class="suggested-portions"><b>SUGGESTED PER CONTAINER</b><br>${esc(c.label)}: ${total>0?'~'+(total/count).toFixed(1)+' g':'enter total cooked weight first'}</div>`}).join('')}</div>`;
    }).join('');
  }

  const portion = bodyFor('6.');
  if(portion){
    portion.innerHTML = cookingPortionLabelsV92();
  }
  return shell.innerHTML;
};
window.__EMMELLI_COOK_BUILD='FINAL-COMPONENT-CONVERGENCE-2026-10-01';
</script>
