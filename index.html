function budgetWeek(y,m,w){
 let first=new Date(y,m,1,12),start=new Date(first);start.setDate(first.getDate()-((first.getDay()-3+7)%7)+(w-1)*7);let end=new Date(start);end.setDate(start.getDate()+6);
 let months=[],cursor=new Date(start.getFullYear(),start.getMonth(),1,12),last=new Date(end.getFullYear(),end.getMonth(),1,12);while(cursor<=last){months.push([cursor.getFullYear(),cursor.getMonth()]);cursor.setMonth(cursor.getMonth()+1)}
 let anchor=new Date((state.budget.balanceAsOf||"2026-09-27")+"T12:00:00"),startKey=localDateKey(start),endKey=localDateKey(end),preAnchor=start<anchor,raw=months.flatMap(([yy,mm])=>{let a=budgetEvents(yy,mm),extra=monthExtra(yy,mm);if(extra>0)a.push({date:new Date(yy,mm+1,0,12),label:"Month-end purchases",amount:-extra,kind:"spend",monthEnd:true});return a}).filter(x=>{let k=localDateKey(x.date);return k>=startKey&&k<=endKey}).sort((a,b)=>a.date-b.date),flow=[];
 let bal=null;if(end>=anchor){if(start<=anchor){bal=Number(state.budget.balance||0)}else{let opening=projectionOpening(start.getFullYear(),start.getMonth());if(opening!==null){bal=opening;let before=budgetEvents(start.getFullYear(),start.getMonth()).filter(x=>x.date<start&&x.date>anchor);before.forEach(x=>bal+=x.amount)}}}
 raw.forEach(x=>{if(x.date<=anchor){flow.push({...x,balance:null});return}if(bal!==null)bal+=x.amount;flow.push({...x,balance:bal})});
 return hero(`${new Date(y,m).toLocaleString("en",{month:"long",year:"numeric"})} • Week ${w}`,`${start.toLocaleDateString()} → ${end.toLocaleDateString()}`)+back(new Date(y,m).toLocaleString("en",{month:"long"}))+`<section class="card"><h2>Wednesday → Tuesday</h2>${preAnchor?`<p class="muted">Balance projection begins ${anchor.toLocaleDateString()}; dates before that live-balance anchor are not projected.</p>`:""}${flow.map(x=>`<div class="checkrow"><span style="flex:1">${x.date.toLocaleDateString()} • ${esc(x.label)}</span><b>${x.amount>=0?"+":""}${money(x.amount)} → ${x.balance===null?"—":money(x.balance)}</b></div>`).join("")||'<p class="muted">No scheduled events in this Wednesday-to-Tuesday budget week.</p>'}</section>`;

function validDateKey(x){if(!/^\d{4}-\d{2}-\d{2}$/.test(String(x)))return false;let [y,m,d]=String(x).split("-").map(Number),dt=new Date(y,m-1,d,12);return dt.getFullYear()===y&&dt.getMonth()===m-1&&dt.getDate()===d}
function hasWeight(d){let v=state.weight?.[d];return v!==""&&v!=null&&Number.isFinite(Number(v))}
function hasMeasure(d){let m=state.measure?.[d];return !!m&&Object.values(m).some(v=>v!==""&&v!=null&&Number.isFinite(Number(v)))}
function hasStudy(d){return (typeof state.studyNotes?.[d]==="string"&&state.studyNotes[d].trim()!=="")||(typeof state.studyResources?.[d]==="string"&&state.studyResources[d].trim()!=="")}
function hasBible(d){return Array.isArray(state.bible?.[d]?.entries)&&state.bible[d].entries.some(v=>String(v||"").trim()!=="")}
function hasMacros(d){let a=state.actualFood?.[d];return !!a&&Object.values(a).some(v=>v!==""&&v!=null&&Number.isFinite(Number(v)))}
function hasRun(d){let r=state.run?.[d];return !!r&&[r.incline,r.speed,r.duration].some(v=>Number.isFinite(Number(v))&&Number(v)>0)}
function hasGym(d){let g=state.gymLog?.[d];return !!g&&Object.values(g).some(z=>z&&typeof z==="object"&&(z.done||Object.entries(z).some(([k,v])=>/^[wr]\d+$/.test(k)&&String(v??"").trim()!=="")))}

 if(type==="food"){(state.foodHistory||[]).forEach(x=>set.add((x.date||"").slice(0,10)));Object.keys(state.actualFood||{}).forEach(x=>{if(hasMacros(x))set.add(x)})}
 if(type==="gym"){Object.keys(state.gymLog||{}).forEach(x=>{if(hasGym(x))set.add(x)});Object.keys(state.run||{}).forEach(x=>{if(hasRun(x)){let m=x.match(/\d{4}-\d{2}-\d{2}/);if(m)set.add(m[0])}})}

 if(type==="complete"){let add=x=>{let m=String(x).match(/\d{4}-\d{2}-\d{2}/);if(m)set.add(m[0])};Object.keys(state.weight).filter(hasWeight).forEach(add);Object.keys(state.measure||{}).filter(hasMeasure).forEach(add);Object.keys(state.bible).filter(hasBible).forEach(add);[...new Set([...Object.keys(state.studyNotes||{}),...Object.keys(state.studyResources||{})])].filter(hasStudy).forEach(add);(state.foodHistory||[]).map(x=>x.date).forEach(add);Object.keys(state.actualFood||{}).filter(hasMacros).forEach(add);Object.keys(state.gymLog||{}).filter(hasGym).forEach(add);Object.keys(state.run||{}).filter(hasRun).forEach(add);Object.keys(state.goalsByDate||{}).filter(x=>Array.isArray(state.goalsByDate[x])&&state.goalsByDate[x].length).forEach(add);Object.keys(state.goalHistory||{}).filter(x=>Object.values(state.goalHistory[x]||{}).some(v=>v&&v.done)).forEach(add);Object.keys(state.water||{}).filter(x=>state.water[x]).forEach(add);Object.keys(state.checks||{}).filter(x=>state.checks[x]).forEach(add);Object.keys(state.routineStatus||{}).filter(x=>Object.values(state.routineStatus[x]||{}).some(Boolean)).forEach(add);Object.keys(state.routineSnapshots||{}).filter(x=>state.routineSnapshots[x]?.tasks?.some(t=>t.done||(t.subtasks||[]).some(q=>q.done))).forEach(add);Object.keys(state.routineStarts||{}).filter(x=>state.routineStarts[x]!==""&&state.routineStarts[x]!=null&&Number.isFinite(Number(state.routineStarts[x]))).forEach(add)}
 return [...set].filter(validDateKey).sort()
}
