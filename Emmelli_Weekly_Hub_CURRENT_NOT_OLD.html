function cooking(){let names=COOKDAYS[state.date]||[];if(!names.length)return hero('COOKING',state.date)+back()+`<section class="card">NO COOKING SCHEDULED.</section>`;let sess=state.cook[state.date]||(state.cook[state.date]={components:{},containers:[],completed:false});names.forEach(ensureRecipeSession);return hero('COOKING',state.date)+back()+`<section class="card soft"><h2>TODAY'S COOKING</h2>${names.map(n=>`<div class="meal"><b>${n}</b><br><button class="tiny" data-recipelink="${esc(n)}">ORIGINAL RECIPE LINK</button></div>`).join('')}</section>${['GET EVERYTHING OUT','PREP + MEASURE','COOK EVERYTHING TOGETHER','CONTAINERS'].map((stage,i)=>`<details class="stage"><summary>${i+1}. ${stage}</summary><div>${i===0?getOut(names):i===1?prep(names):i===2?timelineRows():containers(names,sess)}</div></details>`).join('')}`}
function getOut(names){let groups={FREEZER:[],FRIDGE:[],PANTRY:[],SEASONINGS:[],PRODUCE:[],EQUIPMENT:[]},seen=new Set();function groupFor(name){let x=String(name).toUpperCase();if(/FROZEN|CAULIFLOWER|BROCCOLI|CORN|SPINACH/.test(x))return 'FREEZER';if(/CHICKEN|STEAK|BEEF|CREAM|MILK|PARMESAN|PESTO|BUTTER|EGG/.test(x))return 'FRIDGE';if(/CARROT|CELERY|ONION|GARLIC|GREEN ONION|AVOCADO/.test(x))return 'PRODUCE';if(/SÁZON|THYME|PAPRIKA|GINGER|SESAME|SALT|PEPPER|ITALIAN/.test(x))return 'SEASONINGS';return 'PANTRY'}function add(g,name,recipe){let key=g+'|'+name+'|'+recipe;if(seen.has(key))return;seen.add(key);groups[g].push({line:name,recipe})}names.forEach(recipe=>(RECIPE_COMPONENTS[recipe]||[]).forEach(c=>(c.ingredients||[]).forEach(([name])=>add(groupFor(name),name,recipe))));groups.EQUIPMENT=[{line:'SCALE • FOOD THERMOMETER • REQUIRED POTS / SKILLETS • CUTTING BOARD FOR PRODUCE • KNIFE • MEASURING JUG • MINIMUM PREP BOWLS • PAPER PLATES FOR RAW MEAT • COOKING UTENSILS',recipe:'BOTH RECIPES'},{line:'4 CONTAINERS + MATCHING LIDS • LABELING SUPPLIES',recipe:'PORTION + STORAGE'}];return `<p class="muted">NO MEASUREMENTS HERE — THIS IS ONLY THE COMPLETE PULL LIST. DUPLICATE USES STAY ATTRIBUTED TO THE RECIPE THAT NEEDS THEM.</p>${Object.entries(groups).map(([g,a])=>`<div class="component"><h2>${g}</h2>${a.length?a.map(x=>`<div class="check"><div class="grow"><b>${esc(x.line)}</b><small>${esc(x.recipe)}</small></div></div>`).join(''):'<p class="muted">NONE.</p>'}</div>`).join('')}`}
function prep(names){let defs=COOK_PREP_V37[state.date]||{};return names.map(n=>{let measured=(RECIPE_COMPONENTS[n]||[]).flatMap(c=>(c.ingredients||[]).map(([name,amount])=>`${amount} G ${name} • ${c.name}`));return `<div class="component"><h2>${esc(n)}</h2>${(defs[n]||[]).map(v=>`<div class="meal"><b>${esc(v.title)}</b>${v.lines.map(x=>`<p>${esc(x)}</p>`).join('')}</div>`).join('')||'<p class="muted">NO SAVED BOWL PLAN.</p>'}<details class="component-card"><summary>ALL MEASURED INGREDIENTS — VERIFY BEFORE HEAT</summary><div>${measured.map(x=>`<label class="check"><input type="checkbox"><b>${esc(x)}</b></label>`).join('')}</div></details></div>`}).join('')}
function timelineRows(){return (TIMELINE_V37[state.date]||[]).map((x,j)=>`<div class="component"><div class="row between"><b>${j+1}. ${esc(x[0])}</b><span class="frac">${esc(x[4])}</span></div><small>${esc(x[1])} • ${esc(x[3])}</small><p>${esc(x[2])}</p><p><b>READY WHEN:</b> ${esc(x[5])}</p><p class="muted"><b>WHILE THIS RUNS:</b> ${esc(x[6])}</p></div>`).join('')}
function containers(names,sess){return names.map(recipe=>{let comps=ensureRecipeSession(recipe),intended=intendedForRecipe(recipe).slice(0,2);return `<section class="component recipe-pack"><h2>${esc(recipe)}</h2><p class="muted">CONFIRM EACH GENUINE COMPONENT, ENTER ITS ACTUAL FINISHED WEIGHT, THEN PACK EXACT GRAMS INTO EACH CONTAINER.</p>${comps.map((c,ci)=>{let cm=componentMacros(c),dens=componentDensity(c);return `<details class="component-card" open><summary>${esc(c.name)} • ${c.saved?'SAVED':'OPEN'}${c.weight?` • ${esc(c.weight)} G`:''}</summary><div>${c.ingredients.map((ing,ii)=>`<div class="ingredient-row"><label class="check"><input type="checkbox" data-ingused="${esc(recipe)}|${ci}|${ii}" ${ing.used!==false?'checked':''}><div class="grow"><b>${esc(ing.name)}</b><small>${esc(ing.source)} • ${esc(ing.when)}</small></div></label><input type="number" data-ingamt="${esc(recipe)}|${ci}|${ii}" value="${esc(ing.actualAmount)}" placeholder="G"><button class="tiny" data-editingredient="${esc(recipe)}|${ci}|${ii}">EDIT</button><button class="tiny" data-nutritioningredient="${esc(recipe)}|${ci}|${ii}">NUTRITION</button><button class="tiny" data-removeingredient="${esc(recipe)}|${ci}|${ii}">REMOVE</button></div>`).join('')}<button class="btn" data-addingcomp="${esc(recipe)}|${ci}">+ ADD INGREDIENT</button><label class="field">ACTUAL FINISHED COMPONENT WEIGHT (G)<input type="number" data-compweight2="${esc(recipe)}|${ci}" value="${esc(c.weight)}"></label><p class="muted">COMPONENT NUTRITION: ${cm.complete?`${Math.round(cm.macros.calories)} CAL • ${Math.round(cm.macros.protein)}P • ${Math.round(cm.macros.carbs)}C • ${Math.round(cm.macros.fat)}F • ${Math.round(cm.macros.fiber)} FIBER`:'INCOMPLETE — ADD NUTRITION FOR UNRECOGNIZED INGREDIENTS.'}</p><button class="btn primary" data-savecomp2="${esc(recipe)}|${ci}">${c.saved?'SAVED — UPDATE COMPONENT':'SAVE COMPONENT'}</button></div></details>`}).join('')}<section class="portion-grid"><h3>PORTIONING</h3>${comps.map((c,ci)=>{let target=Number(c.weight||0)/2,p1=Number(sess.pack?.[recipe]?.[ci]?.[0]||0),p2=Number(sess.pack?.[recipe]?.[ci]?.[1]||0),un=Math.max(0,Number(c.weight||0)-p1-p2);return `<div class="portion-row"><b>${esc(c.name)}</b><small>${c.weight?`${c.weight} G FINISHED → 2 CONTAINERS → SUGGESTED ${Math.round(target)} G EACH • UNALLOCATED ${Math.round(un)} G`:'ENTER FINISHED WEIGHT FIRST'}</small><input type="number" data-pack2="${esc(recipe)}|${ci}|0" value="${esc(sess.pack?.[recipe]?.[ci]?.[0]||'')}" placeholder="ACTUAL #1 G"><input type="number" data-pack2="${esc(recipe)}|${ci}|1" value="${esc(sess.pack?.[recipe]?.[ci]?.[1]||'')}" placeholder="ACTUAL #2 G"></div>`}).join('')}<div class="label-pair">${[0,1].map(i=>{let hit=intended[i]||intended[0]||{date:'UNASSIGNED',slot:'EXTRA'},loc=i===0?'FRIDGE':'FREEZER';return `<div class="label-preview"><b>CONTAINER ${i+1}</b><br>${hit.date==='UNASSIGNED'?'UNASSIGNED / DEEP FREEZER':shortLabel(hit.date,hit.slot,loc)+(loc==='FREEZER'?`<br>THAW ${new Date(new Date(hit.date+'T12:00').getTime()-86400000).toLocaleDateString('en-US',{weekday:'short'}).toUpperCase()}`:'')}</div>`}).join('')}</div><button class="btn" data-containerextra="${esc(recipe)}">+ ADD TO THIS CONTAINER</button><button class="btn primary" data-saverecipecontainers="${esc(recipe)}">SAVE 2 FINISHED CONTAINERS</button></section></section>`}).join('')+`<section class="soft card"><b>PHYSICAL LABEL RULE</b><p>LINE 1: DAY + MM/DD • LINE 2: LUNCH/DINNER + LOCATION • LINE 3: THAW DAY IF FREEZER. RECIPE NAME DOES NOT GO ON THE PHYSICAL LABEL.</p><button class="btn primary" data-cookcomplete>MARK COOKING COMPLETE</button></section>`}

function tread(rec,p){return `<section class="card"><h2>TREADMILL</h2><div class="form"><label class="field">DURATION<input type="number" data-tread="duration" value="${esc(rec.tread.duration)}"></label><label class="field">SPEED<input data-tread="speed" value="${esc(rec.tread.speed)}"></label><label class="field">INCLINE<input data-tread="incline" value="${esc(rec.tread.incline)}"></label></div></section>`}function abs(rec){return `<section class="card"><h2>ABS</h2>${ABS.map((x,i)=>`<label class="check"><input type="checkbox" data-abs="${i}" ${rec.abs[i]?'checked':''}><b>${x}</b></label>`).join('')}<p class="muted">KNEE CRUNCHES ARE COMPLETELY UNWEIGHTED FOR NOW. LATER, ONLY THE FIRST 8 MAY USE WEIGHT; START AT 10 LB. LAST 8 ALWAYS BODYWEIGHT.</p></section>`}
function exercise(e,ei,rec){let [name,type,inc,defaults]=e;state.gymProgress=state.gymProgress||{};let gp=state.gymProgress[name]||(state.gymProgress[name]={weights:[...defaults],nextIndex:2});let sets=rec.sets[ei]||(rec.sets[ei]=gp.weights.map((w,i)=>({w,reps:[12,10,8][i],done:false}))),next=(gp.nextIndex??2)+1;return `<div class="component"><h2>${name}</h2><small>${type} • EQUIPMENT-SPECIFIC NEXT INCREMENT ${inc}</small>${sets.map((s,si)=>`<div class="form"><label class="field">SET ${si+1} WEIGHT<input data-set="${ei}|${si}|w" value="${esc(s.w)}"></label><label class="field">REPS<input type="number" data-set="${ei}|${si}|reps" value="${s.reps}"></label><label class="check"><input type="checkbox" data-setdone="${ei}|${si}" ${s.done?'checked':''}><b>SET ${si+1} COMPLETE</b></label></div>`).join('')}<button class="btn" data-moveup="${ei}">READY TO MOVE UP • NEXT: SET ${next}</button><p class="muted">PROGRESSION ORDER: SET 3 → SET 2 → SET 1, THEN THE CYCLE REPEATS. ONLY THAT SET MOVES TO THE NEXT VALID LOAD FOR THIS EXERCISE.</p></div>`}

function weeks(){let base=1160,envelopes=180,start=new Date('2026-09-29T12:00:00'),rows=[];for(let w=0;w<6;w++){let s=new Date(start);s.setDate(start.getDate()+7*w);let next=new Date(s);next.setDate(s.getDate()+7);let income=base+(state.budget.extraIncome||[]).filter(x=>{let d=new Date(x.date+'T12:00');return d>=s&&d<next}).reduce((a,x)=>a+Number(x.amount||0),0);let bills=monthBills(2026,9).filter(b=>{let due=new Date(b.moved||`2026-10-${String(b.day).padStart(2,'0')}T12:00`);return due>s&&due<=next&&!state.budget.paid[b.key]}).reduce((a,b)=>a+Number(b.amt||0),0);rows.push(`<div class="week-row"><b>${s.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})} → ${next.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}</b><span>INCOME ${money(income)} • ENVELOPES ${money(envelopes)} • UNPAID BILLS DUE ${money(bills)} • PLANNED REMAINDER ${money(income-envelopes-bills)}</span></div>`)}return hero('WEEK BY WEEK','TUESDAY → TUESDAY')+back()+`<section class="card"><p><b>WEEKLY INCOME:</b> JOB #1 $650 • JOB #2 $325 • JEREMIAH $185 • TOTAL $1,160</p><p><b>WEEKLY ENVELOPES:</b> GAS $60 • HOUSEHOLD/PRODUCE $100 • DOGS/REPTAR $20 • TOTAL $180</p><button class="btn" data-addincome>+ ADD INCOME</button>${rows.join('')}</section>`}function months(){let undated=BILLS.filter(x=>x[2]===null).reduce((a,b)=>a+Number(b[1]||0),0),oct=monthBills().reduce((a,b)=>a+b.amt,0)+undated;return hero('MONTHS','MONTHLY BILL VIEW')+back()+`<section class="card"><h2>OCTOBER 2026</h2><p><b>KNOWN OCTOBER OBLIGATIONS: ${money(oct)}</b></p><p>CREDIT CARD: $300 THIS MONTH ONLY • MOM PAYBACK: $200 ON OCT 13 ONLY • FUTURE CREDIT CARD RETURNS TO $25 • FPL PERMANENTLY $100 • HP INSTANT INK $17 + CHATGPT PLUS $19.99 ARE INCLUDED IN THE MONTH TOTAL EVEN THOUGH THEIR DUE DATES ARE NOT SAVED.</p></section><section class="card"><h2>REGULAR MONTH</h2><p>RENT $2,065 • CREDIT CARD $25 • ALL OTHER RECURRING AUTOPAYS STAY ON THEIR SAVED DUE DATES.</p></section>`}
